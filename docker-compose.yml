services:
  app:
    # Image is built in CI and published to GHCR; APP_IMAGE is written to .env by the deploy job.
    # For local builds: docker compose build (uses the Dockerfile below).
    image: ${APP_IMAGE}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: UpDownLoader
    restart: unless-stopped
    environment:
      - UpDownLoaderBot__Telegram__Token=${UpDownLoaderBot__Telegram__Token}
    ports:
      - "8080:8080"
    volumes:
      # Instagram cookies (kept out of the image); resolved via YtDlp:InstagramCookiesFile.
      # The whole directory is mounted read-write: yt-dlp refreshes the Instagram session on every
      # run and writes it to InstagramCookies.session.txt here, so a renewed session outlives both
      # container restarts and redeploys.
      - ./cookies:/app/cookies
